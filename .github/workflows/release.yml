name: "publish"

on:
  push:
    branches:
      - release
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required so the updater plugin can verify downloads. Set these as
          # repository secrets (see Settings → Secrets and variables → Actions).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Build a universal macOS binary so Intel Macs are covered. Without an
          # explicit target the runner only builds its own arch (arm64), which
          # left Intel users with no .dmg and no `darwin-x86_64` entry in
          # latest.json — so they could neither install nor be told about updates.
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}
          # `v__VERSION__` matches every historical tag and the CHANGELOG links.
          # Do not tag manually as well: two tags per version means two releases,
          # and `releases/latest` (which the updater reads) resolves to whichever
          # was published last.
          tagName: v__VERSION__ # the action replaces __VERSION__ with the app version
          releaseName: "Ortu v__VERSION__"
          releaseBody: "See [CHANGELOG.md](https://github.com/abhijith-p-subash/ortu/blob/main/CHANGELOG.md) for what changed, and the assets below to download this version."
          releaseDraft: true
          prerelease: false
